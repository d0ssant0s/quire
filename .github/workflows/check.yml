name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned by commit; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mise installs the Node version that mise.toml pins for local work.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: mise exec -- npm ci
      - run: mise exec -- npm run check
      - run: mise exec -- npx playwright install --with-deps chromium
      - run: mise exec -- npm run check:browser
