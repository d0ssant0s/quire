name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # edited: a changed title is checked again as a commit subject.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  # The changelog is built from commit subjects, and a squash merge takes the
  # pull request's title as its subject, so both must be conventional commits.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: mise exec -- node scripts/check-commit.mjs --subject "$TITLE" --range "$BASE_SHA..$HEAD_SHA"
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  check:
    # A title edit changes no file.
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned by commit; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mise installs the Node version that mise.toml pins for local work.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      # A release tag must name the version the package declares.
      - if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(mise exec -- node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: mise exec -- npm ci
      - run: mise exec -- npm run check
      - run: mise exec -- npx playwright install --with-deps chromium
      - run: mise exec -- npm run check:browser

  # A release tag that passed the checks gets a GitHub release page, whose notes
  # are the version's section of CHANGELOG.md. Only this job may write.
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: mise exec -- node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - run: gh release create "$GITHUB_REF_NAME" --title "quire ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
